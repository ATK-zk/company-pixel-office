<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020405">
<title>Pixel Office · Hacker Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head><body>
<canvas id="c"></canvas>
<div id="ovl">
  <div id="ovTicker" class="ov"><span class="blink">●</span> SIM-BTC/USD 1m <b id="tpx">—</b> <em id="tch"></em><span class="fake">⚠ ข้อมูลจำลอง · FAKE DEMO DATA — ไม่ใช่ราคาจริง</span></div>
  <div id="ovBoard" class="ov">
    <div class="bt">มูลค่าสุทธิ <span>// NET VALUE</span></div>
    <div id="bval">$—</div>
    <div class="bd">วันนี้ · DAY PnL <b id="bday">—</b></div>
    <div id="bnote"></div>
  </div>
</div>
<div id="labels"></div>
<div id="tl" class="panel">
  <div class="tlhead"><b>&gt;_ PIXEL OFFICE</b><span id="clock">--:--</span></div>
  <div class="menu" id="menu"></div>
  <div class="bar"><span class="fill g" id="wbar"></span><span class="lbl">WORK</span><em id="wcount">-/8</em></div>
  <div id="upd" class="small">⏳ กำลังโหลด…</div>
</div>
<div id="zoombar">
  <button id="zin" class="rb" title="ซูมเข้า">＋</button><button id="zout" class="rb" title="ซูมออก">－</button><button id="zreset" class="rb" title="ทั้งห้อง">⟲</button><button id="music" class="rb" title="เปิด/ปิดเพลง" aria-label="เปิดเพลง">🔇</button>
</div>
<div id="hint">ลากเพื่อเลื่อน · ล้อเมาส์/ถ่างนิ้วเพื่อซูม · แตะตัวละครเพื่อดูงาน · 🔇 เปิดเพลง</div>
<div id="card" class="panel hidden">
  <button id="cardx">✕</button>
  <div class="avw"><canvas id="avatar" width="16" height="24"></canvas></div>
  <div class="cbody"><div id="cname"></div><div id="crole"></div><div id="cstat"></div><div id="cact"></div></div>
</div>
<audio id="bgm" autoplay muted playsinline preload="auto"></audio>
<script src="office.js?v=4"></script>
<script src="music.js?v=2"></script>
</body></html>
