<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<title>Autonomous Trading HQ — Polymarket Perps</title>
<meta name="description" content="Live pixel headquarters of a 6-person autonomous Polymarket Perps trading desk.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d9b56a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=17">
</head><body>
<canvas id="c"></canvas>
<div id="ovl"></div>
<div id="labels"></div>

<header id="top">
    <div class="nav">
    <i id="phasePip" class="phasepip" title="Bangkok day"></i>
    <div class="seg"><span class="livetag"><i></i><em>LIVE</em></span><label>NAV</label><b id="tNav">—</b><em id="tDay"></em></div>
    <div class="seg"><label>VOLUME</label><b id="tVol">—</b><em>all-time</em></div>
    <a class="seg" id="rankBox" href="https://polymarket.com/leaderboard/perps/all/volume" target="_blank" rel="noopener"><label>VOL RANK</label><b id="tRank">—</b><em id="tOf"></em></a>
  </div>
  <div class="meta"><div class="clk"><label>BANGKOK</label><b id="clock">--:--</b><em id="phaseLbl">DAY</em></div><div><label>EQUITY SYNC</label><b id="syncT">—</b></div></div>
</header>

<aside id="roster" class="glass">
  <div class="rh"><b>THE DESK</b><span id="wcount">— ACTIVE</span></div>
  <p id="statusAt" class="asof"></p>
  <div id="menu"></div>
  <div id="sys"></div>
</aside>

<nav id="ctrl" class="glass" aria-label="View controls">
  <button id="ztog" title="Hide view &amp; sound controls" aria-label="Hide view and sound controls" aria-expanded="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="M15 15l5 5"/><path class="ztog-x" d="M8 10.5h5"/></svg></button>
  <div class="zgrp" id="zgrp">
  <button id="zin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="zout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="zreset" title="Fit office" aria-label="Fit office"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <span class="sep"></span>
  <button id="music" title="Play soundtrack" aria-label="Play soundtrack"><svg class="off" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9l5 6M22 9l-5 6"/></svg><span class="eq"><i></i><i></i><i></i><i></i></span></button>
  </div>
</nav>
<div id="nowp" class="glass"></div>
<div id="hint">Drag to pan · Scroll to zoom · Click a deskmate · <b>♪</b> for sound</div>

<div id="card" class="glass hidden">
  <button id="cardx" aria-label="Close">×</button>
  <div class="avw"><canvas id="avatar" width="64" height="80"></canvas></div>
  <div class="cbody"><div id="crole"></div><div id="cname"></div><div id="cduty"></div><div id="cstat"></div><div id="cact"></div></div>
</div>

<div id="splash"><div class="sp"><span id="spmsg">OPENING THE TRADING FLOOR</span><i><u id="spbar"></u></i></div></div>
<audio id="bgm" playsinline preload="none"></audio>
<script src="office.js?v=17"></script>
<script src="music.js?v=16"></script>
</body></html>
