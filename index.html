<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<title>PIXEL OFFICE // Black Gold Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head><body>
<canvas id="c"></canvas>
<div id="ovl">
  <div id="ovTicker" class="ov"><span class="blink">●</span> BTC-PERP 1m <b id="tpx">—</b> <em id="tch"></em></div>
  <div id="ovBoard" class="ov">
    <div class="bt">NET VALUE <span>// ACCOUNT EQUITY</span></div>
    <div id="bval">$—</div>
    <div class="bd">DAY PnL <b id="bday">—</b></div>
    <div id="bnote"></div>
  </div>
</div>
<div id="labels"></div>
<div id="tl" class="panel">
  <div class="tlhead"><b>&gt;_ BLACK GOLD DESK</b><span id="clock">--:--</span></div>
  <div class="menu" id="menu"></div>
  <div class="bar"><span class="fill g" id="wbar"></span><span class="lbl">WORK</span><em id="wcount">-/8</em></div>
  <div id="upd" class="small">⏳ booting…</div>
</div>
<div id="zoombar">
  <button id="zin" class="rb" title="Zoom in">＋</button><button id="zout" class="rb" title="Zoom out">－</button><button id="zreset" class="rb" title="Fit office">⟲</button><button id="music" class="rb" title="Music on/off" aria-label="Music on">🔇</button>
</div>
<div id="hint">drag to pan · scroll / pinch to zoom · tap an agent · 🔇 music</div>
<div id="card" class="panel hidden">
  <button id="cardx">✕</button>
  <div class="avw"><canvas id="avatar" width="16" height="24"></canvas></div>
  <div class="cbody"><div id="cname"></div><div id="crole"></div><div id="cstat"></div><div id="cact"></div></div>
</div>
<audio id="bgm" autoplay muted playsinline preload="auto"></audio>
<script src="office.js?v=5"></script>
<script src="music.js?v=3"></script>
</body></html>
