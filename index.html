<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<title>Black Gold Desk — Autonomous Trading HQ</title>
<meta name="description" content="Live pixel headquarters of Black Gold Desk, an autonomous Polymarket Perps trading team.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%2307080a' stroke='%23d9b56a' stroke-width='2'/%3E%3Cpath d='M11 11v10M16 8v14M21 13v7' stroke='%23d9b56a' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
</head><body>
<canvas id="c"></canvas>
<div id="ovl">
  <div id="ovBoard" class="ov">
    <div class="bt"><span class="livetag"><i></i><em>LIVE</em></span><b>NET ASSET VALUE</b><span class="src">POLYMARKET PERPS</span></div>
    <div id="bval">—</div>
    <div class="bm"><div><label>DAY P&amp;L</label><b id="bday">—</b> <b id="bpct"></b></div><div class="r"><label>AS OF</label><b id="basof">—</b></div></div>
  </div>
</div>
<div id="labels"></div>

<header id="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dca0"/><stop offset="1" stop-color="#a8823f"/></linearGradient></defs><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="#0a0b0e" stroke="url(#lg)" stroke-width="1.4"/><path d="M11 12v9M16 9v13M21 14v6" stroke="url(#lg)" stroke-width="2.6" stroke-linecap="square"/><path d="M11 10v2M11 21v2M16 7v2M16 22v2M21 12v2M21 20v2" stroke="#f3dca0" stroke-width=".9" opacity=".7"/></svg>
    <div><b>BLACK GOLD DESK</b><span>AUTONOMOUS PERPS TRADING · HQ</span></div>
  </div>
  <div class="nav"><span class="livetag"><i></i><em>LIVE</em></span><label>NAV</label><b id="tNav">—</b><em id="tDay"></em></div>
  <div class="meta"><div><label>BANGKOK</label><b id="clock">--:--</b></div><div><label>EQUITY SYNC</label><b id="syncT">—</b></div></div>
</header>

<aside id="roster" class="glass">
  <div class="rh"><b>THE DESK</b><span id="wcount">— ACTIVE</span></div>
  <div id="menu"></div>
  <div id="sys"></div>
</aside>

<nav id="ctrl" class="glass" aria-label="View controls">
  <button id="zin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="zout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="zreset" title="Fit office" aria-label="Fit office"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <span class="sep"></span>
  <button id="music" title="Play soundtrack" aria-label="Play soundtrack"><svg class="off" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9l5 6M22 9l-5 6"/></svg><span class="eq"><i></i><i></i><i></i><i></i></span></button>
</nav>
<div id="nowp" class="glass"></div>
<div id="hint">Drag to pan · Scroll to zoom · Click a teammate · <b>♪</b> for sound</div>

<div id="card" class="glass hidden">
  <button id="cardx" aria-label="Close">×</button>
  <div class="avw"><canvas id="avatar" width="64" height="80"></canvas></div>
  <div class="cbody"><div id="crole"></div><div id="cname"></div><div id="cstat"></div><div id="cact"></div></div>
</div>

<div id="splash"><div class="sp">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="none" stroke="#d9b56a" stroke-width="1.2"/><path d="M11 12v9M16 9v13M21 14v6" stroke="#d9b56a" stroke-width="2.6"/></svg>
  <b>BLACK GOLD DESK</b><span id="spmsg">OPENING THE TRADING FLOOR</span><i><u id="spbar"></u></i>
</div></div>
<audio id="bgm" playsinline preload="none"></audio>
<script src="office.js?v=10"></script>
<script src="music.js?v=10"></script>
</body></html>
